services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: disable_comments_dev
    ports:
      - '3310:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  mysql-test:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: disable_comments_test
    ports:
      - '3311:3306'
    tmpfs:
      - /var/lib/mysql

volumes:
  mysql-data:
